<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sift</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Sift — a job seeker's daily desk.
   One memorable thing: the search is a sentence ("I'm looking for …") set large, roles underlined in marigold.
   Everything else is quiet: one typeface, a sage paper, a forest green for actions, statuses as small coloured marks. */
:root{
  --bg:#fbfcfa; --surface:#ffffff; --sunk:#f3f6f3; --line:#e4e9e3; --line2:#eef1ed;
  --ink:#26302c; --ink2:#55615b; --muted:#77817c;
  --accent:#2f7d5b; --accent-ink:#ffffff; --accent-soft:#e6f4ec; --accent-line:#c9e5d5; --accent-strong:#1f6146; --hi:#f5c84c; --hi-soft:#fef7df;
  --go:#2f8a5c; --go-soft:#e9f6ef; --ask:#946510; --ask-soft:#fef7df; --check:#56789a; --check-soft:#edf2f8;
  --no:#9a9494; --no-soft:#f4f3f3; --bad:#c0392b; --bad-soft:#fdeeec;
  --font:"Inter","Segoe UI",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(38,48,44,.04),0 4px 14px rgba(38,48,44,.04);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#19211d; --sunk:#1f2924; --line:#2c3732; --line2:#25302b;
  --ink:#e8eee9; --ink2:#bcc6c0; --muted:#8d9892;
  --accent:#7fc8a4; --accent-ink:#0d1f17; --accent-soft:#1e3329; --accent-line:#2f4c3e; --accent-strong:#a3dcbf; --hi:#f5c542; --hi-soft:#3a2f10;
  --go:#7fc8a4; --go-soft:#1b3228; --ask:#f5c542; --ask-soft:#3a2f10; --check:#9cb8d6; --check-soft:#1f2a36;
  --no:#8d9892; --no-soft:#232b27; --bad:#ff8a80; --bad-soft:#3a1916;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#19211d; --sunk:#1f2924; --line:#2c3732; --line2:#25302b;
  --ink:#e8eee9; --ink2:#bcc6c0; --muted:#8d9892;
  --accent:#7fc8a4; --accent-ink:#0d1f17; --accent-soft:#1e3329; --accent-line:#2f4c3e; --accent-strong:#a3dcbf; --hi:#f5c542; --hi-soft:#3a2f10;
  --go:#7fc8a4; --go-soft:#1b3228; --ask:#f5c542; --ask-soft:#3a2f10; --check:#9cb8d6; --check-soft:#1f2a36;
  --no:#8d9892; --no-soft:#232b27; --bad:#ff8a80; --bad-soft:#3a1916;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.tabs .n,.rb-total,.activity li .t,.score,.today{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar: wordmark, two pages as underlined text, the date */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:28px;min-height:58px;flex-wrap:wrap}
.mark{font-weight:800;font-size:1.7rem;letter-spacing:-.06em;line-height:1;position:relative;padding-right:9px}
.mark::after{content:"";position:absolute;right:0;bottom:.18em;width:6px;height:6px;border-radius:50%;background:var(--hi)}
.mark i{font-style:normal}
.pages{display:flex;gap:22px;align-self:stretch}
.pages a{display:flex;align-items:center;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.pages a:hover{color:var(--ink)}
.pages a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.today{margin-left:auto;font-size:.88rem;color:var(--muted)}
@media (max-width:640px){.today{display:none}}
.status{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--go)} .dot.busy{background:var(--hi)} .dot.err{background:var(--bad)}
main{padding-block:36px 72px}
@media (max-width:640px){main{padding-block:24px 56px} header.top .wrap{gap:18px}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:600;font-size:.9rem;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink);transition:background-color .15s,border-color .15s}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-strong)}
.btn.primary:hover{border-color:var(--accent);filter:none}
.btn.quiet{background:none;border-color:transparent;color:var(--accent);padding-inline:4px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.btn.quiet:hover{text-decoration-thickness:2px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.hint{font-size:.86rem;color:var(--muted)}

/* the sentence */
.search{display:flex;flex-direction:column;gap:12px}
.search label.lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.search .bar{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;font-size:clamp(1.15rem,2.4vw,1.5rem);font-weight:700;letter-spacing:-.015em;line-height:1.35;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.search .bar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search .bar::before{content:"I'm looking for";color:var(--muted);font-weight:500}
.chip{display:inline-flex;align-items:baseline;gap:2px;background:linear-gradient(transparent 70%,var(--hi-soft) 70%);box-shadow:inset 0 -3px 0 var(--hi);padding:0 1px;color:var(--ink)}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:.55em;font-weight:500;padding:0 3px;align-self:center;border-radius:4px}
.chip button:hover{color:var(--bad)}
.search .bar{align-items:center}
.search input{flex:1 1 200px;min-width:160px;align-self:center;border:0;outline:0;background:transparent;padding:4px 0;font-size:1rem;font-weight:500;letter-spacing:0;color:var(--ink)}
.search input::placeholder{color:var(--muted);opacity:.7}

/* the live square: one box that shows the step running now and its newest update */
.steps{margin-top:24px}
.live{display:flex;flex-direction:column;gap:6px;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:14px;padding:16px 18px;color:var(--ink)}
.live.idle{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.live.wait{background:var(--hi-soft);border-color:color-mix(in srgb,var(--hi) 45%,transparent)}
.live.fail{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 25%,transparent)}
.live-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live-title{font-size:1.1rem;font-weight:700;letter-spacing:-.01em}
.live-step{font-size:.8rem;font-weight:500;color:var(--muted)}
.live-head .btn{margin-left:auto}
.beacon{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 0 var(--accent)}
.live.idle .beacon{background:var(--line);box-shadow:none;animation:none}
.live.wait .beacon{background:var(--hi);box-shadow:none;animation:none}
.live.fail .beacon{background:var(--bad);box-shadow:none;animation:none}
@media (prefers-reduced-motion:no-preference){.live:not(.idle):not(.wait):not(.fail) .beacon{animation:beacon 1.6s ease-out infinite}}
@keyframes beacon{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.live-update{display:flex;gap:12px;align-items:baseline;font-size:.95rem;color:var(--ink2);padding-left:20px;min-height:1.5em}
.live-update .t{margin-left:auto;font-size:.8rem;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.live-update.fresh span:first-child{animation:swapin .45s ease-out}}
@keyframes swapin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.live-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-left:20px;margin-top:6px}
.live .confirm{margin-left:20px;margin-top:4px;background:var(--surface)}
@media (max-width:640px){.live-update,.live-acts{padding-left:0}.live .confirm{margin-left:0}}
.doing{font-size:.9rem}

/* views: underlined text tabs */
.feedsec{margin-top:36px}
.steps[hidden] + .feedsec{margin-top:8px}
.toolbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:0}
.tabs{display:flex;gap:4px 22px;flex-wrap:wrap}
.tabs button{border:0;background:none;border-bottom:2px solid transparent;padding:10px 0;margin-bottom:-1px;font-weight:600;color:var(--muted);cursor:pointer;font-size:.95rem}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .n{display:inline-block;margin-left:6px;font-size:.78rem;font-weight:600;color:var(--ink2);background:var(--sunk);border-radius:6px;padding:0 6px;line-height:1.6}
.tabs button[aria-pressed="true"] .n{background:var(--ink);color:var(--bg)}
.tabs .btn.quiet{color:var(--muted);text-decoration:none;padding:10px 0}
.tabs .btn.quiet[aria-pressed="true"]{color:var(--ink)}
.switch{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted);padding:10px 0}
/* job search: a quiet box at the end of the tab row */
.jobsearch{position:relative;display:flex;align-items:center;margin-bottom:8px;flex:0 1 280px;min-width:0}
.jobsearch svg{position:absolute;left:11px;width:15px;height:15px;color:var(--muted);pointer-events:none}
.jobsearch input{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:7px 32px 7px 33px;font-size:.92rem;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.jobsearch input::placeholder{color:var(--muted)}
.jobsearch input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.jobsearch input::-webkit-search-cancel-button{display:none}
.jobsearch .clear{position:absolute;right:4px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.05rem;line-height:1;padding:4px 8px;border-radius:6px}
.jobsearch .clear:hover{color:var(--ink)}
.meta .when{color:var(--muted)}.switch input{accent-color:var(--accent);width:16px;height:16px}

@media (max-width:640px){
  .toolbar .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
  .toolbar .tabs::-webkit-scrollbar{display:none}
  .toolbar .tabs button{flex:none}
  .toolbar{flex-direction:column;align-items:flex-start;gap:0}
  .jobsearch{flex:none;width:100%;margin:4px 0 10px;order:-1}}
/* the feed: rows on one sheet */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;box-shadow:var(--shadow)}
.list > .hint{padding:14px 20px}
.job{position:relative;display:flex;flex-direction:column;gap:8px;padding:18px 20px 18px 24px;border-top:1px solid var(--line2);min-width:0;transition:background-color .15s}
.job:first-child{border-top:0}
.job:hover{background:color-mix(in srgb,var(--sunk) 55%,transparent)}
.job::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0;background:var(--line)}
.job.go::before{background:var(--go)} .job.ask::before{background:var(--hi)} .job.new::before{background:var(--accent);opacity:.35} .job.check::before{background:var(--check)}
.jt{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.jt h3{font-size:1.08rem;font-weight:700;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:.9rem;color:var(--ink2);margin-top:3px;overflow-wrap:anywhere}
.meta .co{font-weight:600;color:var(--ink)}
.meta .src{color:var(--muted)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex:none}
.side .open{font-size:.88rem;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;white-space:nowrap;color:var(--ink2);padding-top:3px}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.go{color:var(--go)} .pill.ask{color:var(--ask)} .pill.no{color:var(--no)} .pill.new{color:var(--muted)} .pill.check{color:var(--check)}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.facts span{font-size:.8rem;background:var(--sunk);color:var(--ink2);border-radius:6px;padding:1px 8px;font-weight:500}
.facts span.clash{background:var(--bad-soft);color:var(--bad)}
.reason{font-size:.94rem;color:var(--ink2);max-width:72ch}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:2px}
.acts .remove{margin-left:auto;background:none;border-color:transparent;color:var(--muted)}
.acts .remove:hover{color:var(--ink);border-color:var(--line)}
.acts select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);font-size:.88rem;font-weight:500}
.score{font-size:.82rem;opacity:.85}
details.more{max-width:72ch}
details.more summary{cursor:pointer;font-size:.88rem;font-weight:600;color:var(--ink2);list-style:none;display:inline-flex;align-items:center;gap:6px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details.more[open] summary::before{transform:rotate(45deg)}
.adtext{white-space:pre-wrap;font-size:.9rem;line-height:1.6;max-height:320px;overflow:auto;border-left:2px solid var(--line);padding:4px 0 4px 14px;margin-top:8px;color:var(--ink2)}
.empty{padding:48px 24px;text-align:center;color:var(--ink2)}
.empty h3{margin-bottom:6px;font-size:1.15rem}
.empty p{max-width:46ch;margin:0 auto}
.empty .applied-today{font-size:2.75rem;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--go);margin-bottom:8px;font-variant-numeric:tabular-nums}

/* Ask me: the question sits above its answer */
.answer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex:1 1 100%;background:var(--hi-soft);border-radius:10px;padding:12px 14px;margin-top:4px}
.answer .k{font-weight:600;font-size:.95rem}
.answer .k.q{flex:1 1 100%;color:var(--ink)}
.answer select{min-height:38px;border-radius:8px;border:1px solid var(--line);padding:4px 10px;background:var(--surface);color:var(--ink);font-weight:500}
.anstext{display:flex;flex-direction:column;gap:8px;flex:1 1 100%}
.anstext textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;background:var(--surface);color:var(--ink)}
.anstext .btn{align-self:flex-end}

/* misc */
.banner{border-radius:10px;padding:12px 14px;font-size:.92rem;margin-bottom:16px;background:var(--hi-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--bad-soft);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);padding:10px 16px;border-radius:10px;font-size:.92rem;font-weight:500;z-index:20;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);flex:none}
@media (prefers-reduced-motion:no-preference){.spinner{animation:spin 1s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem;background:var(--hi-soft);border-radius:10px;padding:8px 12px}
.err{color:var(--bad);font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.row-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}

/* About Me */
.me-page{display:flex;flex-direction:column;gap:20px;max-width:780px}
.me-head{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.me-head h1{font-size:clamp(1.9rem,4vw,2.5rem);letter-spacing:-.03em;font-weight:800}
.me-head > .hint{max-width:62ch;font-size:.95rem}
.kicker{font-size:.9rem;font-weight:600;color:var(--accent)}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.me-sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.me-sec h2{font-size:1.2rem;margin-bottom:4px}
.me-sec > .hint{margin-bottom:10px}
@media (max-width:640px){.me-sec{padding:18px 16px}}
.doctext{white-space:pre-wrap;overflow-wrap:anywhere;max-height:440px;overflow:auto;border-left:2px solid var(--hi);padding:2px 0 2px 16px;font-size:.94rem;line-height:1.65}
textarea.doctext{width:100%;min-height:360px;max-height:none;border:1px solid var(--accent);border-radius:10px;padding:12px 14px;font-family:inherit;color:var(--ink);background:var(--surface)}
.cvrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 0}
.upload{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;border:2px dashed var(--line);border-radius:14px;padding:32px 16px;margin:16px 0;cursor:pointer;text-align:center;transition:border-color .15s,background-color .15s}
.upload:hover,.upload:focus-within{border-color:var(--accent);background:var(--accent-soft)}
.upload strong{font-size:1.05rem}
.upload input{max-width:100%;margin-top:10px}
.learned{list-style:none;padding:0;margin:4px 0 0;display:flex;flex-direction:column}
.learned li{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line2)}
.learned li:first-child{border-top:0}
.field{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr);gap:4px 20px;padding:13px 0;border-top:1px solid var(--line2);align-items:start}
.field:first-of-type{border-top:0}
@media (max-width:640px){.field{grid-template-columns:1fr}}
.field .k{font-weight:600;font-size:.94rem}
.field .u{font-size:.8rem;color:var(--muted);margin-top:2px}
.field .v{cursor:text;border-radius:8px;padding:5px 8px;margin:-5px -8px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.95rem;transition:background-color .15s}
.field .v:hover{background:var(--sunk)}
.field .v.empty{color:var(--muted)}
.field input[type=text],.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:.95rem}
.field input[type=text]:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:110px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{display:flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:.92rem;cursor:pointer;background:var(--surface)}
.opts label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opts input{accent-color:var(--accent)}
</style>

<header class="top">
  <div class="wrap">
    <div class="mark" aria-label="Sift">sift</div>
    <nav class="pages" id="pages" aria-label="Pages"></nav>
    <div class="today" id="today"></div>
    <div class="status" id="sync" hidden><span class="dot"></span><span>Starting…</span></div>
  </div>
</header>
<main class="wrap">
  <div id="banners"></div>
  <div id="page-feed">
  <section class="search" aria-labelledby="roles-lbl">
    <label class="lbl" id="roles-lbl" for="role-input">Roles I'm looking for</label>
    <div class="bar" id="bar"><input id="role-input" type="text" placeholder="Add a role and press Enter" aria-label="Add a role you're looking for, then press Enter" autocomplete="off"></div>
  </section>
  <div class="steps" id="steps" aria-label="Steps"></div>
  <section class="feedsec" aria-label="Daily feed">
    <div class="toolbar"><div class="tabs" id="tabs" role="toolbar" aria-label="Feed views"></div>
      <div class="jobsearch" role="search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
        <input id="job-q" type="search" placeholder="Search jobs, companies, places" aria-label="Search jobs" autocomplete="off">
        <button class="clear" id="job-q-clear" type="button" aria-label="Clear search" hidden>×</button>
      </div></div>
    <div class="list" id="list"><div class="empty"><h3>Loading your feed…</h3><p>Your jobs appear here.</p></div></div>
  </section>
  </div>
  <div id="page-me" hidden></div>
</main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
"use strict";
/* ---------------- config ---------------- */
const SHEET_ID_DEFAULT = "YOUR_GOOGLE_SHEET_ID";   // your job-search Google Sheet
const SHEETS = "Google Sheets", DRIVE = "Google Drive", REMOTE = "Claude Code Remote";
// Same tables and columns as the sheet (engine/na_core.py SCHEMA). Tab <-> collection, row <-> document.
const SCHEMA = {
  Search: { coll: "search", key: "setting", range: "Search!A1:C40", cols: ["setting","value","help"] },
  Me:     { coll: "me", key: "fact", range: "Me!A1:C60", cols: ["fact","value","usedFor"] },
  Feed:   { coll: "feed", key: "jobId", sheet: "'New jobs'", range: "'New jobs'!A1:T5000", cols: ["dateFound","source","title","company","location","link","facts","role","decision","reason","requirements","cv","cvScore","status","note","dateApplied","posted","jobId","advert","applyUrl"] },
  Runs:   { coll: "runs", key: null, range: "Runs!A1:D2000", cols: ["when","step","summary","problems"] },
};
const COL = (tab, field) => String.fromCharCode(65 + SCHEMA[tab].cols.indexOf(field));
const STATUSES = ["", "Applied", "Interview", "Offer", "Rejected by employer"];
const RUNS = [["collect","Collect"],["shortlist","Shortlist"],["cvs","Tailor CVs"]];

/* ---------------- state ---------------- */
const pageFromHash = () => ({ "#me": "me", "#history": "history", "#jobs": "history" })[location.hash] || "feed";
const S = { page: pageFromHash(), isOwner: undefined, uid: null,
            search: {}, me: {}, feed: {}, runs: {}, tasks: null, views: { feed: "ready", history: "new" }, useFacts: true, sheetId: SHEET_ID_DEFAULT,
            sync: { state: "idle", text: "", at: 0 }, about: undefined, sample: null, wz: null, askText: {}, cvBusy: "", running: null, progress: {}, db: undefined, mcp: undefined, confirm: null, openAd: {}, editing: null, q: "", shortAt: undefined };
try { const v = JSON.parse(localStorage.getItem("na:views") || "null"); if (v) Object.assign(S.views, v); } catch (e) {}
const saveViews = () => { try { localStorage.setItem("na:views", JSON.stringify(S.views)); } catch (e) {} };

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v; else if (k === "checked") e.checked = !!v; else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
function toast(m, warn){ if (!warn) return; const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200); }
const fold = s => String(s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase();
const slug = s => fold(s).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 120) || "x";
function docIdFor(tab, f, row){
  if (tab === "Runs") return "r" + String(row).padStart(6, "0");
  const v = String(f[SCHEMA[tab].key] || "").trim();
  if (tab === "Feed") return /^[A-Za-z0-9_\-]{1,120}$/.test(v) ? v : "row" + String(row).padStart(6, "0");
  return v ? slug(v) : "row" + String(row).padStart(6, "0");
}
const kv = coll => { const o = {}; for (const d of Object.values(S[coll])) if (d[SCHEMA[coll === "search" ? "Search" : "Me"].key]) o[fold(d[SCHEMA[coll === "search" ? "Search" : "Me"].key]).trim()] = d; return o; };
const splitList = v => String(v || "").split(/[,;\n]/).map(x => x.trim()).filter(Boolean);
const todayISO = () => new Date().toLocaleDateString("en-CA", { timeZone: "Europe/London" });
const mcpMsg = (e, server) => ({
  needs_reauth: `Reconnect ${server} in claude.ai Settings → Connectors.`,
  server_not_connected: `Add ${server} in claude.ai Settings → Connectors.`,
  selection_required: `Choose which ${server} connector Sift should use when claude.ai asks.`,
  not_in_manifest: `${server} isn't allowed for Sift yet. Allow it from the page's permissions.`,
  approval_required: `Sift needs your approval to use ${server}. Try again and allow it.`,
  blocked_by_policy: `Your organisation blocks ${server} here.`,
  server_unavailable: `${server} didn't answer. Try again in a moment.`,
}[e && e.code] || (e && e.code === "tool_error" ? `${server} said: ${String(e.message || "").slice(0, 160)}` : `Couldn't reach ${server}. Try again.`));

/* ---------------- role + fact matching (same rules as the engine) ---------------- */
const STOP = new Set(["junior","graduate","grad","entry","level","trainee","assistant","associate","the","and","of","in","for","a","an","roles","role","jobs","job"]);
const SUFFIXES = ["ments","ment","ers","er","ing","ics","ist","ists","s","e"];
const CHANGES_JOB = new Set(["marketing","sales","account","project","programme","program","owner","designer","design","support","recruitment","recruiter","teacher","security","network","facilities"]);
function stem(w){ w = w.toLowerCase(); for (const s of SUFFIXES) if (w.length - s.length >= 4 && w.endsWith(s)) { w = w.slice(0, -s.length); break; } if (w.length > 5 && w.endsWith("e")) w = w.slice(0, -1); return w; }
function same(a, b){ const x = stem(a), y = stem(b); return x === y || (Math.min(x.length, y.length) >= 5 && (x.startsWith(y) || y.startsWith(x))); }
function roleMatch(title, role){
  const tw = String(title).toLowerCase().match(/[a-z0-9+#]+/g) || [];
  const words = role.toLowerCase().split(/[^a-z0-9+#]+/).filter(x => x.length > 1 && !STOP.has(x));
  if (!words.length) return false;
  const pos = [];
  for (const w of words) { const hits = tw.map((t, i) => same(t, w) ? i : -1).filter(i => i >= 0); if (!hits.length) return false; pos.push(hits); }
  if (pos[0].some(p => words.every((_, k) => pos[k].includes(p + k)))) return true;
  const used = new Set(pos.flat());
  return !tw.some((t, i) => !used.has(i) && CHANGES_JOB.has(t));
}
function myRules(){
  const s = kv("search"), m = kv("me");
  const fluent = splitList((m["fluent languages"] || {}).value || "English").map(x => x.split("(")[0].trim().toLowerCase());
  const maxYears = parseFloat((s["max years asked"] || {}).value);
  return {
    roles: splitList((s["roles"] || {}).value),
    exclude: splitList((s["not these roles"] || {}).value).map(x => x.toLowerCase()),
    patterns: splitList((s["work patterns"] || {}).value).map(x => x.toLowerCase().replace("onsite", "on-site")),
    maxYears: isNaN(maxYears) ? null : maxYears,
    needsVisa: /^y/i.test(String((m["needs visa sponsorship"] || {}).value || "")),
    fluent,
  };
}
function clashes(job, R){
  const f = String(job.facts || "").toLowerCase(), out = [];
  const yrs = /(\d+)\+ yrs/.exec(f); if (yrs && R.maxYears != null && +yrs[1] > R.maxYears) out.push(yrs[0]);
  if (R.needsVisa && f.includes("no visa sponsorship")) out.push("no visa sponsorship");
  const lang = /needs ([a-z, ]+)/.exec(f); if (lang) for (const l of lang[1].split(",").map(x => x.trim()).filter(Boolean)) if (!R.fluent.includes(l)) out.push("needs " + l);
  for (const p of ["remote","hybrid","on-site"]) if (R.patterns.length && f.split(" · ").includes(p) && !R.patterns.includes(p)) out.push(p);
  const tl = String(job.title || "").toLowerCase(); for (const x of R.exclude) if (x && new RegExp("(^|[^a-z])" + x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "([^a-z]|$)").test(tl)) out.push(x);
  return out;
}

/* ---------------- capabilities ---------------- */
(async () => {
  const c = window.claude;
  if (!c || !c.use) { S.db = null; S.mcp = null; render(); return; }
  c.use("mcp").then(m => { S.mcp = m; render(); syncFromSheet(); });
  c.use("sample").then(sm => { S.sample = sm; });
  Promise.all([c.use("db"), c.use("user")]).then(async ([db, user]) => {
    S.db = db;
    S.isOwner = user ? await user.isOwner() : false;
    S.uid = user ? await user.id() : null;
    render();
    if (!db || !S.isOwner) return;   // Sift is just for its owner: the jobs live in her Google Sheet
    const sub = coll => db.collection(coll).onSnapshot(snap => {
      const o = {}; for (const d of snap.docs) o[d.id] = Object.assign({ _id: d.id }, d.data()); S[coll] = o; render();
    }, () => {});
    sub("search"); sub("me"); sub("runs");
    db.doc("about/me").onSnapshot(d => { S.about = d.exists ? d.data() : null; render(); }, () => { S.about = null; render(); });
    db.doc("config/tasks").onSnapshot(d => { S.tasks = d.exists ? d.data() : null; render(); }, () => {});
    db.doc("config/shortlisted").onSnapshot(d => { const x = d.exists ? d.data() : {}; S.shortAt = x.at || {}; S.shortSeeded = !!x.seeded; stampShortlisted(); render(); }, () => {});
    db.doc("config/running").onSnapshot(d => {
      const before = S.running; S.running = d.exists ? d.data() : null;
      if (before && before.step !== "collect" && (!S.running || S.running.runId !== before.runId) && S._stopped !== before.runId && S._finished !== before.runId) {
        syncFromSheet(); toast(STEP_NAME[before.step] + " finished.");
      }
      checkDone(); render();
    }, () => {});
    db.collection("progress").onSnapshot(snap => { const o = {}; for (const d of snap.docs) o[d.id] = d.data(); S.progress = o; checkDone(); render(); }, () => {});
    syncFromSheet();
  });
})();

/* ---------------- whose tables ----------------
   Sift is just for its owner. The owner's jobs live only in their job-search Google Sheet (the New jobs tab);
   their settings, facts, About me, run log and the run controls live in Sift's database. */
const P = coll => coll;
const usesSheet = () => S.isOwner === true;
const norm = v => { const t = String(v == null ? "" : v).trim(); const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(t); return m ? `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}` : t; };
const jobKey = (title, company) => fold(title) + "|" + fold(company);
/* Edits made in the sheet while Sift is open show up within a minute, and as soon as you come back to the tab. */
function pullNow(){ if (document.visibilityState === "visible" && S.isOwner) syncFromSheet(); }
setInterval(pullNow, 60000);
document.addEventListener("visibilitychange", pullNow);

/* ---------------- the sheet (where your jobs live) ---------------- */
/* The sheet tab behind each table (the feed lives in the "New jobs" tab). */
const sheetName = tab => SCHEMA[tab].sheet || tab;
const SHEET_TABS = ["Feed"];
const inSheet = tab => usesSheet() && SHEET_TABS.includes(tab);
/* Jobs tab = your applications list (Job title | Company | Link | CV | Applied | Date applied). Marking a job Applied ticks it there. */
async function addToJobsTab(j){ return markAppliedInJobsTab(j, null); }
async function markAppliedInJobsTab(j, applied){   // applied: true / false, or null = just make sure the job is listed
  try {
    const rows = ((await sheetsCall("get_values", { range: "Jobs!A1:F1000" })) || {}).values || [];
    const i = rows.findIndex((r, k) => k > 0 && (r[2] === j.link || (fold(r[0]) === fold(j.title) && fold(r[1]) === fold(j.company))));
    const d = applied ? new Date().toLocaleDateString("en-GB", { timeZone: "Europe/London" }) : "";
    if (i > 0) { if (applied !== null) await sheetsCall("update_values", { range: `Jobs!D${i + 1}:F${i + 1}`, values: [[rows[i][3] || cvLink(j.cv) || "", applied ? "TRUE" : "FALSE", d]] }); }
    else {
      const firstEmpty = rows.findIndex((r, k) => k > 0 && !r[0]);
      const at = firstEmpty > 0 ? firstEmpty + 1 : rows.length + 1;
      await sheetsCall("update_values", { range: `Jobs!A${at}:F${at}`, values: [[j.title, j.company, j.link, cvLink(j.cv) || "", applied ? "TRUE" : "FALSE", d]] });
    }
  } catch (e) {}
}
async function removeFromJobsTab(j){   // clears the job's row in the Jobs tab; the next shortlisted job reuses the empty row
  try {
    const rows = ((await sheetsCall("get_values", { range: "Jobs!A1:F1000" })) || {}).values || [];
    const i = rows.findIndex((r, k) => k > 0 && (r[2] === j.link || (fold(r[0]) === fold(j.title) && fold(r[1]) === fold(j.company))));
    if (i > 0) await sheetsCall("update_values", { range: `Jobs!A${i + 1}:F${i + 1}`, values: [["", "", "", "", "", ""]] });
  } catch (e) {}
}
async function sheetsCall(tool, input){
  if (!S.mcp) throw { code: "capability_disabled" };
  const r = await S.mcp.callTool(SHEETS, tool, Object.assign({ spreadsheetId: S.sheetId }, input), { cache: false });
  return r.payload;
}
function rowsToDocs(tab, values){
  const out = {}, cols = SCHEMA[tab].cols;
  (values || []).slice(1).forEach((r, i) => {
    const row = i + 2, f = { row };
    cols.forEach((c, j) => f[c] = r[j] == null ? "" : String(r[j]));
    if (tab !== "Runs" && !String(f[SCHEMA[tab].key] || "").trim() && cols.every(c => !f[c])) return;
    out[docIdFor(tab, f, row)] = f;
  });
  return out;
}
let syncing = null;
async function syncFromSheet(){
  if (syncing || S.mcp === undefined || S.isOwner === undefined) return syncing;
  if (!usesSheet()) return;
  if (!S.mcp) { setSync("err", "Google Sheets isn't available in this view, so your jobs can't be shown. Open Sift in Claude."); return; }
  syncing = (async () => {
    setSync("busy", "Reading your sheet…");
    try {
      const feed = rowsToDocs("Feed", (await sheetsCall("get_values", { range: SCHEMA.Feed.range }) || {}).values);
      for (const [id, j] of Object.entries(feed)) j._id = id;
      const n = await pullAppliedTicks(feed);
      S.feed = feed;
      moveAdvertsOnce(feed);
      stampShortlisted();
      setSync("ok", "In sync with your sheet" + (n ? ` (${n} Applied tick${n === 1 ? "" : "s"} copied)` : ""));
    } catch (e) { setSync("err", mcpMsg(e, SHEETS)); }
    syncing = null; render();
  })();
  return syncing;
}
/* One time only: adverts and apply links used to be kept in Sift's database. Copy them into the sheet's
   Advert (S) and Apply link (T) columns, then remember it's done. After this nothing reads the old copy. */
const cellText = v => { const t = String(v || ""); return /^[=+\-@]/.test(t) ? "'" + t : t; };
async function moveAdvertsOnce(feed){
  if (!S.db || moveAdvertsOnce.busy) return;
  moveAdvertsOnce.busy = true;
  try {
    const flag = await S.db.doc("config/migration").get();
    if (flag.exists && flag.data().adverts) return;
    const old = await new Promise((ok, no) => { let un = null; un = S.db.collection("feed").onSnapshot(snap => { ok(snap.docs.map(d => d.data())); if (typeof un === "function") setTimeout(un, 0); }, no); });
    const byId = {}; for (const j of Object.values(feed)) if (j.jobId) byId[j.jobId] = j;
    let n = 0;
    for (const d of old) {
      const j = byId[d.jobId]; if (!j || (!d.advert && !d.applyUrl) || j.advert || j.applyUrl) continue;
      const at = COL("Feed", "advert"), to = COL("Feed", "applyUrl");
      await sheetsCall("update_values", { range: `'New jobs'!${at}${j.row}:${to}${j.row}`, values: [[cellText(String(d.advert || "").slice(0, 6000)), cellText(d.applyUrl)]] });
      j.advert = d.advert || ""; j.applyUrl = d.applyUrl || ""; n++;
    }
    await S.db.doc("config/migration").set({ adverts: true, copied: n, at: new Date().toISOString() });
    if (n) { toast(`Copied ${n} advert${n === 1 ? "" : "s"} into your sheet.`); render(); }
  } catch (e) {} finally { moveAdvertsOnce.busy = false; }
}
/* Your Jobs tab: ticking Applied there marks the job Applied in New jobs too. */
async function pullAppliedTicks(feed){
  let n = 0;
  try {
    const rows = ((await sheetsCall("get_values", { range: "Jobs!A1:F1000" })) || {}).values || [];
    const jobs = Object.values(feed || {});
    for (const r of rows.slice(1)) {
      if (String(r[4] || "").toUpperCase() !== "TRUE") continue;
      const j = jobs.find(j => (r[2] && j.link === r[2]) || jobKey(j.title, j.company) === jobKey(r[0], r[1]));
      if (!j || j.status) continue;
      const f = { status: "Applied", dateApplied: norm(r[5]) || todayISO() };
      await sheetsCall("update_values", { range: `'New jobs'!${COL("Feed", "status")}${j.row}:${COL("Feed", "dateApplied")}${j.row}`, values: [[f.status, j.note || "", f.dateApplied]] });
      Object.assign(j, f); n++;
    }
  } catch (e) {}
  return n;
}
function setSync(state, text){ S.sync = { state, text, at: Date.now() }; renderSync(); }

/* When each job joined the shortlist, so Shortlisted can show the newest first. The sheet has no column for it,
   so Sift keeps it in its database (config/shortlisted: jobId -> time). A job gets its time when you press
   Shortlist it, or the first time Sift sees the Shortlist step has shortlisted it. Jobs that were already
   shortlisted before this existed get the date they were found (date only, so the card doesn't claim a time).
   A job that leaves the shortlist loses its time, so shortlisting it again puts it back on top. */
let stamping = false;
async function saveShortAt(next, seeded){
  if (!S.db || !S.isOwner) return;
  S.shortAt = next;
  try { await S.db.doc("config/shortlisted").set({ at: next, seeded: seeded || !!S.shortSeeded }); } catch (e) {}
}
async function stampShortlisted(){
  if (stamping || !S.db || !S.isOwner || S.shortAt === undefined || !Object.keys(S.feed).length) return;
  const next = Object.assign({}, S.shortAt), now = new Date().toISOString();
  let changed = false;
  for (const j of Object.values(S.feed)) {
    if (!j._id || !j.title) continue;
    const b = bucket(j);
    if (b === "ready" && !next[j._id]) { next[j._id] = S.shortSeeded ? now : (norm(j.dateFound) || now.slice(0, 10)); changed = true; }
    else if (b !== "ready" && b !== "tracked" && b !== "interview" && next[j._id]) { delete next[j._id]; changed = true; }
  }
  if (!changed && S.shortSeeded) return;
  stamping = true;
  try { await saveShortAt(next, true); S.shortSeeded = true; } finally { stamping = false; }
}
function markShortlisted(j, on){
  if (S.shortAt === undefined) return;
  const next = Object.assign({}, S.shortAt);
  if (on) next[j._id] = new Date().toISOString(); else delete next[j._id];
  saveShortAt(next);
}
const shortWhen = j => (S.shortAt && S.shortAt[j._id]) || "";

/* Jobs: write the cells in the sheet (the only copy). Settings and facts: write them in Sift's database. */
async function write(tab, id, fields){
  const coll = SCHEMA[tab].coll, doc = S[coll][id];
  if (!doc) throw new Error("not found");
  if (!inSheet(tab)) { await S.db.doc(P(coll) + "/" + id).update(fields); return; }
  const cols = Object.keys(fields).map(f => SCHEMA[tab].cols.indexOf(f)).sort((a, b) => a - b);
  // confirm the row still holds this record (rows can move if the sheet was edited by hand)
  const keyCol = SCHEMA[tab].key ? COL(tab, SCHEMA[tab].key) : null;
  if (keyCol) {
    const got = await sheetsCall("get_values", { range: `${sheetName(tab)}!${keyCol}${doc.row}` });
    const v = ((got && got.values) || [[""]])[0][0] || "";
    if (docIdFor(tab, { [SCHEMA[tab].key]: v }, doc.row) !== id) { await syncFromSheet(); throw new Error("moved"); }
  }
  const first = cols[0], last = cols[cols.length - 1], rowVals = [];
  for (let c = first; c <= last; c++) { const f = SCHEMA[tab].cols[c]; rowVals.push(f in fields ? fields[f] : (doc[f] ?? "")); }
  await sheetsCall("update_values", { range: `${sheetName(tab)}!${String.fromCharCode(65 + first)}${doc.row}:${String.fromCharCode(65 + last)}${doc.row}`, values: [rowVals] });
  Object.assign(doc, fields);
  render();
}
async function safeWrite(tab, id, fields, ok){
  try { await write(tab, id, fields); if (ok) toast(ok); }
  catch (e) { toast(e && e.message === "moved" ? "That row moved in the sheet. Sift re-read it: try again." : usesSheet() ? mcpMsg(e, SHEETS) : "Couldn't save. Try again.", 1); }
}
/* Add a row that doesn't exist yet: a job goes to the sheet (then re-reads it); a setting or fact to Sift's database. */
async function createRow(tab, fields){
  const coll = SCHEMA[tab].coll, cols = SCHEMA[tab].cols;
  if (inSheet(tab)) {
    await sheetsCall("append_values", { range: sheetName(tab) + "!A1", values: [cols.map(c => fields[c] ?? "")] });
    await syncFromSheet();
    return;
  }
  const row = Math.max(1, ...Object.values(S[coll]).map(d => d.row || 0)) + 1;
  const f = Object.assign({}, ...cols.map(c => ({ [c]: fields[c] ?? "" })), { row });
  await S.db.doc(P(coll) + "/" + docIdFor(tab, f, row)).set(f);
}
async function setField(tab, key, value, okMsg, usedFor){
  const table = tab === "Search" ? "search" : "me", doc = kv(table)[fold(key).trim()];
  try {
    if (doc) await write(tab, doc._id || slug(key), { value });
    else await createRow(tab, tab === "Search" ? { setting: key, value, help: usedFor || "" } : { fact: key, value, usedFor: usedFor || "" });
    if (okMsg) toast(okMsg);
  } catch (e) { toast(e && e.message === "moved" ? "That row moved in the sheet. Sift re-read it: try again." : usesSheet() ? mcpMsg(e, SHEETS) : "Couldn't save. Try again.", 1); }
}

/* ---------------- actions ---------------- */
async function setRoles(list){
  await setField("Search", "Roles", list.join(", "), "Saved. The next collection searches these roles.", "The role search bar in Sift.");

            h("button", { class: "btn primary", onclick: async () => { try { await saveAbout({ [field]: S.draft }); S.editing = null; toast("Saved."); renderMe(); } catch (e) { toast("Couldn't save. Try again.", 1); } } }, "Save")))
      : val ? h("div", { class: "doctext", tabindex: "0" }, val) : h("p", { class: "hint" }, "Upload your CV to create this."));
}

/* ---------------- Me page ----------------
   Every field is one row of the Me or Search table (Fact | Value | Used for), the same shape as the sheet's tabs. */
const ME_PAGE = [
  ["About you", "Who you are and how you get to work. Used for the train check, visa and language rules.", [
    ["Me", "Name", "text", "Your profile and CVs"],
    ["Me", "Home", "text", "Train check for hybrid and on-site roles", "e.g. Leicester, UK"],
    ["Me", "Gets to the office by", "choice", "Train check", ["Train only (no driving licence)", "Public transport", "Car", "Any way"]],
    ["Me", "Right to work in UK", "text", "Shortlist", "e.g. Yes (British citizen)"],
    ["Me", "Needs visa sponsorship", "choice", "Yes = jobs that say they can't sponsor are dropped", ["No", "Yes"]],
    ["Me", "Fluent languages", "text", "Jobs that require another fluent language are dropped", "e.g. English, Arabic"],
    ["Me", "Other languages", "text", "Shortlist"],
    ["Me", "Security clearance", "choice", "Jobs needing clearance you don't have are rejected", ["No", "SC", "DV", "Other"]],
    ["Me", "Available", "text", "Applications", "e.g. Immediately"]]],
  ["What you're looking for", "These decide what Collect searches for and what stays in your feed.", [
    ["Search", "Roles", "text", "The role search bar on your feed", "e.g. product manager, APM"],
    ["Search", "Not these roles", "long", "Titles containing any of these are dropped before review"],
    ["Search", "Places", "text", "Where to look", "e.g. United Kingdom, Remote (UK), Remote (Europe)"],
    ["Search", "Work patterns", "multi", "Jobs that clearly state another pattern are dropped", ["remote", "hybrid", "on-site"]],
    ["Search", "Level", "choice", "entry = senior, lead, principal, head, director and staff titles are dropped", ["entry", "mid", "senior", "any"]],
    ["Search", "Max years asked", "text", "Jobs asking for more years of experience than this are dropped", "e.g. 2"],
    ["Search", "Sources", "text", "Where Collect searches", null, "owner"],
    ["Search", "Daily budget (USD)", "text", "Most the company-sites search spends per Collect", null, "owner"],
    ["Search", "Target companies", "long", "Collect checks these companies' own career pages on every run", "e.g. Monzo, Wise, Deliveroo", "owner"]]],
  ["Your background", "What the shortlist checks a job's essential requirements against.", [
    ["Me", "Degree", "text", "Shortlist"],
    ["Me", "Work experience", "long", "Shortlist"],
    ["Me", "Product experience", "long", "Shortlist", "Projects or products you've built"],
    ["Me", "Skills", "long", "Shortlist: essential-requirements check"]]],
  ["What matters to you", "How the shortlist judges whether a job is right for you.", [
    ["Me", "What I want to do", "long", "Shortlist: the main fit test"],
    ["Me", "Companies I like", "text", "Shortlist"],
    ["Me", "Deal-breakers", "long", "Shortlist: jobs with these are rejected"]]],
  ["Facts for your CVs", "CVs only ever use facts from your About me doc, never anything invented.", [
    ["Me", "Full facts for CVs", "link", "About me Google Doc: the source of facts for your CVs", null, "owner"]]],
];
function fieldValue(tab, key){ const d = kv(tab === "Search" ? "search" : "me")[fold(key).trim()]; return d ? String(d.value || "") : ""; }
function renderMe(){
  const page = $("page-me"); page.replaceChildren();
  const filled = ME_PAGE.flatMap(s => s[2]).filter(f => fieldValue(f[0], f[1])).length;
  page.append(h("div", { class: "me-page" },
    h("div", { class: "me-head" }, h("div", { class: "sec-head" }, h("h1", null, "About Me"),
      h("a", { class: "btn primary", href: "https://docs.google.com/spreadsheets/d/" + (S.sheetId || SHEET_ID_DEFAULT) + "/edit", target: "_blank", rel: "noopener" }, "Open my Google Sheet")),
      h("p", { class: "hint" }, S.isOwner
        ? "Your facts and what you're looking for, saved in Sift. Sift uses them to filter your feed, judge every job and write your CVs. Click any value to change it."
        : "Tell Sift about yourself. It uses this to collect jobs for you, filter your feed, judge every job and write your CVs. Only you and Sift's owner, whose tasks do the searching, can see it."),
      h("p", { class: "hint" }, `${filled} fields filled in.`)),
    aboutCards(),
    ME_PAGE.map(([title, help, fields]) => {
      const shown = fields.filter(f => !f[5] || (f[5] === "owner") === !!S.isOwner);
      if (!shown.length) return null;
      return h("section", { class: "me-sec" }, h("h2", null, title), h("p", { class: "hint" }, help), shown.map(meField));
    })));
}
function meField([tab, key, type, used, extra]){
  const id = "me-" + slug(key), value = fieldValue(tab, key), editing = S.editing === id;
  const save = v => { S.editing = null; v = String(v).trim(); if (v !== value) setField(tab, key, v, "Saved.", used); renderMe(); };
  let input;
  if (type === "choice") {
    input = h("select", { id, onchange: e => save(e.target.value) }, [h("option", { value: "" }, "Choose…"), ...extra.map(o => h("option", { value: o, selected: fold(value).startsWith(fold(o).slice(0, 4)) ? "" : null }, o))]);
    return h("div", { class: "field" }, h("div", null, h("label", { class: "k", for: id }, key), h("div", { class: "u" }, used)), input);
  }
  if (type === "multi") {
    const cur = splitList(value).map(x => x.toLowerCase());
    return h("div", { class: "field" }, h("div", null, h("span", { class: "k" }, key), h("div", { class: "u" }, used)),
      h("div", { class: "opts", role: "group", "aria-label": key }, extra.map(o => h("label", null,
        h("input", { type: "checkbox", id: id + "-" + o, checked: cur.includes(o), onchange: e => { const next = extra.filter(x => x === o ? e.target.checked : cur.includes(x)); setField(tab, key, next.join(", "), "Saved.", used); } }), o))));
  }
  if (type === "link") {
    return h("div", { class: "field" }, h("div", null, h("span", { class: "k" }, key), h("div", { class: "u" }, used)),
      /^https:\/\//.test(value) ? h("a", { href: value, target: "_blank", rel: "noopener" }, "Open your About me doc") : h("span", { class: "v empty" }, "Not set"));
  }
  const body = editing
    ? (type === "long" ? h("textarea", { id, value, onblur: e => save(e.target.value), onkeydown: e => { if (e.key === "Escape") { S.editing = null; renderMe(); } } })
                       : h("input", { type: "text", id, value, placeholder: extra || "", onblur: e => save(e.target.value), onkeydown: e => { if (e.key === "Enter") e.target.blur(); if (e.key === "Escape") { S.editing = null; renderMe(); } } }))
    : h("div", { class: "v" + (value ? "" : " empty"), tabindex: "0", role: "button", "aria-label": "Edit " + key,
        onclick: () => { S.editing = id; renderMe(); setTimeout(() => { const el = $(id); if (el) { el.focus(); el.selectionStart = el.value.length; } }, 0); },
        onkeydown: e => { if (e.key === "Enter") e.currentTarget.click(); } }, value || (extra ? extra : "Add"));
  return h("div", { class: "field" }, h("div", null, h("label", { class: "k", for: id }, key), h("div", { class: "u" }, used)), body);
}

render();
})();
